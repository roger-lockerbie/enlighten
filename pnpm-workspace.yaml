# Supply chain settings. Each one is explained in docs/DEPENDENCIES.md.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
strictDepBuilds: true
allowBuilds: {}
savePrefix: ''
# chokidar 4.0.3 is flagged as a trust downgrade (it was published without the
# provenance that earlier releases had). Accepted for this one version only,
# pulled in by svelte-check. See docs/DEPENDENCIES.md.
trustPolicyExclude:
  - chokidar@4.0.3
# typed-rest-client (pulled in by Stryker) pins qs 6.15.1, which has four
# advisories. 6.16.2 is a patch release in the same line. See docs/DEPENDENCIES.md.
overrides:
  qs: 6.16.2
