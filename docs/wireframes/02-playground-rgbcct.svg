<text x="880" y="284" fill="#e8e8ea" font-size="12" text-anchor="end" font-weight="400">89   </text>
<line x1="520" y1="294" x2="880" y2="294" stroke="#2a2a2f" stroke-width="4"/>
<line x1="520" y1="294" x2="646.0" y2="294" stroke="#8fb4d9" stroke-width="4"/>
<circle cx="646.0" cy="294" r="7" fill="#e8e8ea"/>
<text x="520" y="328" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Blue</text>
<text x="880" y="328" fill="#e8e8ea" font-size="12" text-anchor="end" font-weight="400">25   </text>
<line x1="520" y1="338" x2="880" y2="338" stroke="#2a2a2f" stroke-width="4"/>
<line x1="520" y1="338" x2="556.0" y2="338" stroke="#8fb4d9" stroke-width="4"/>
<circle cx="556.0" cy="338" r="7" fill="#e8e8ea"/>
<text x="520" y="372" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Warm white</text>
<text x="880" y="372" fill="#e8e8ea" font-size="12" text-anchor="end" font-weight="400">152   </text>
<line x1="520" y1="382" x2="880" y2="382" stroke="#2a2a2f" stroke-width="4"/>
<line x1="520" y1="382" x2="736.0" y2="382" stroke="#8fb4d9" stroke-width="4"/>
<circle cx="736.0" cy="382" r="7" fill="#e8e8ea"/>
<text x="520" y="416" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Cool white</text>
<text x="880" y="416" fill="#e8e8ea" font-size="12" text-anchor="end" font-weight="400">0   </text>
<line x1="520" y1="426" x2="880" y2="426" stroke="#2a2a2f" stroke-width="4"/>
<line x1="520" y1="426" x2="520" y2="426" stroke="#8fb4d9" stroke-width="4"/>
<circle cx="520" cy="426" r="7" fill="#e8e8ea"/>
<rect x="900" y="236" width="180" height="28" rx="4" fill="#131315" stroke="#2a2a2f"/>
<text x="912" y="255" fill="#e8e8ea" font-size="12" text-anchor="start" font-weight="400">Colour</text>
<text x="980" y="255" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Raw channels</text>
<text x="228" y="500" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Fade</text>
<rect x="228" y="510" width="300" height="30" rx="4" fill="#1b1b1e" stroke="#2a2a2f"/>
<text x="240" y="530" fill="#e8e8ea" font-size="12" text-anchor="start" font-weight="400">4.0 s  (standard fade time 6)</text>
<text x="228" y="580" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">A colour change costs 11 frames, about 0.35 s of bus time.</text>
<text x="196" y="730" fill="#e8e8ea" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, monospace">% rgb 1 229 89 25 w 152</text>
<text x="196" y="750" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, monospace">  dtr0 229, dtr1 89, dtr2 25, enable-device-type 8, set-temporary-rgb-dimlevel ...</text>
<text x="196" y="770" fill="#8fb4d9" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, monospace">  dapc 148 (clamped from 170: mix limit)</text>
<text x="196" y="790" fill="#e8e8ea" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, monospace">% _</text>
</svg>
