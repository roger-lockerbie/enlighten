<text x="430" y="29" fill="#9a9aa0" font-size="12" text-anchor="middle" font-weight="400">Both</text>
<text x="500" y="29" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Server: not running</text>
