<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="system-ui, sans-serif" font-size="13">
<title>Playground, RGB + CCT</title>
<rect width="1440" height="900" fill="#0b0b0c"/>
