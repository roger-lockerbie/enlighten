<text x="702" y="29" fill="#e8e8ea" font-size="12" text-anchor="start" font-weight="400">Ceiling 40%  arc 220</text>
<text x="928" y="29" fill="#9a9aa0" font-size="11" text-anchor="end" font-weight="400">2/2 verified</text>
<text x="960" y="29" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Bus 3%</text>
<rect x="1016" y="20" width="100" height="8" rx="2" fill="#1b1b1e" stroke="#2a2a2f"/>
<rect x="1016" y="20" width="6" height="8" rx="2" fill="#8fb4d9" stroke="#8fb4d9"/>
<text x="1150" y="29" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Unlocks: none</text>
<rect x="1320" y="8" width="104" height="32" rx="4" fill="#d9534f" stroke="#d9534f"/>
<text x="1372" y="29" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="600">Panic</text>
<rect x="0" y="48" width="180" height="852" rx="0" fill="#131315" stroke="#2a2a2f"/>
<rect x="8" y="64" width="164" height="30" rx="4" fill="#1b1b1e" stroke="#2a2a2f"/>
<text x="24" y="84" fill="#e8e8ea" font-size="13" text-anchor="start" font-weight="400">Playground</text>
<text x="24" y="120" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Looks</text>
<text x="24" y="156" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Sequences</text>
<text x="24" y="192" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Effects</text>
<text x="24" y="228" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Visualiser</text>
<text x="24" y="264" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Switches</text>
<text x="24" y="300" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Devices</text>
<text x="24" y="336" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Bus monitor</text>
<text x="24" y="372" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Settings</text>
<rect x="1120" y="48" width="320" height="632" rx="0" fill="#131315" stroke="#2a2a2f"/>
<text x="1140" y="80" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Inspector</text>
<rect x="180" y="680" width="1260" height="220" rx="0" fill="#09090a" stroke="#2a2a2f"/>
<text x="196" y="702" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Console</text>
<text x="1420" y="702" fill="#9a9aa0" font-size="11" text-anchor="end" font-weight="400">Ctrl-` to hide   help keys</text>
<text x="204" y="84" fill="#e8e8ea" font-size="18" text-anchor="start" font-weight="600">Playground</text>
<rect x="204" y="100" width="896" height="560" rx="4" fill="#131315" stroke="#2a2a2f"/>
<text x="228" y="130" fill="#e8e8ea" font-size="14" text-anchor="start" font-weight="600">1  RGB + CCT</text>
<text x="340" y="130" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">presents as RGBWAF, 5 channels</text>
<text x="228" y="180" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Level</text>
<text x="828" y="180" fill="#e8e8ea" font-size="12" text-anchor="end" font-weight="400">5.6%   arc 148</text>
<line x1="228" y1="190" x2="828" y2="190" stroke="#2a2a2f" stroke-width="4"/>
<line x1="228" y1="190" x2="528.0" y2="190" stroke="#8fb4d9" stroke-width="4"/>
<circle cx="528.0" cy="190" r="7" fill="#e8e8ea"/>
<text x="840" y="195" fill="#8fb4d9" font-size="11" text-anchor="start" font-weight="400">lowered to fit the ceiling: 3 channels on</text>
<rect x="228" y="230" width="260" height="200" rx="4" fill="#1b1b1e" stroke="#2a2a2f"/>
<text x="358" y="335" fill="#9a9aa0" font-size="12" text-anchor="middle" font-weight="400">colour field</text>
<text x="228" y="452" fill="#9a9aa0" font-size="11" text-anchor="start" font-weight="400">Screens cannot show LED colours at full saturation. The tape will look more vivid.</text>
<text x="520" y="240" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Red</text>
<text x="880" y="240" fill="#e8e8ea" font-size="12" text-anchor="end" font-weight="400">229   </text>
<line x1="520" y1="250" x2="880" y2="250" stroke="#2a2a2f" stroke-width="4"/>
<line x1="520" y1="250" x2="844.0" y2="250" stroke="#8fb4d9" stroke-width="4"/>
<circle cx="844.0" cy="250" r="7" fill="#e8e8ea"/>
