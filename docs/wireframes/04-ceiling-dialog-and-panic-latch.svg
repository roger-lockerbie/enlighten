<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="system-ui, sans-serif" font-size="13">
<title>Raising the ceiling, and the panic latch</title>
<rect width="1440" height="900" fill="#0b0b0c"/>
<rect x="0" y="0" width="1440" height="48" rx="0" fill="#131315" stroke="#2a2a2f"/>
<text x="20" y="30" fill="#e8e8ea" font-size="16" text-anchor="start" font-weight="600">Enlighten</text>
<rect x="200" y="10" width="92" height="28" rx="3" fill="#1b1b1e" stroke="#8fb4d9"/>
<text x="246" y="29" fill="#e8e8ea" font-size="12" text-anchor="middle" font-weight="400">Simulator</text>
<rect x="292" y="10" width="92" height="28" rx="3" fill="#131315" stroke="#2a2a2f"/>
<text x="338" y="29" fill="#9a9aa0" font-size="12" text-anchor="middle" font-weight="400">Hardware</text>
<rect x="384" y="10" width="92" height="28" rx="3" fill="#131315" stroke="#2a2a2f"/>
<text x="430" y="29" fill="#9a9aa0" font-size="12" text-anchor="middle" font-weight="400">Both</text>
<text x="500" y="29" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Server: not running</text>
<rect x="690" y="10" width="250" height="28" rx="4" fill="#1b1b1e" stroke="#2a2a2f"/>
<text x="702" y="29" fill="#e8e8ea" font-size="12" text-anchor="start" font-weight="400">Ceiling 40%  arc 220</text>
<text x="928" y="29" fill="#9a9aa0" font-size="11" text-anchor="end" font-weight="400">2/2 verified</text>
<text x="960" y="29" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Bus 3%</text>
<rect x="1016" y="20" width="100" height="8" rx="2" fill="#1b1b1e" stroke="#2a2a2f"/>
<rect x="1016" y="20" width="6" height="8" rx="2" fill="#8fb4d9" stroke="#8fb4d9"/>
<text x="1150" y="29" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Unlocks: none</text>
<rect x="1320" y="8" width="104" height="32" rx="4" fill="#d9534f" stroke="#d9534f"/>
<text x="1372" y="29" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="600">Panic</text>
<rect x="0" y="48" width="180" height="852" rx="0" fill="#131315" stroke="#2a2a2f"/>
<rect x="8" y="64" width="164" height="30" rx="4" fill="#1b1b1e" stroke="#2a2a2f"/>
<text x="24" y="84" fill="#e8e8ea" font-size="13" text-anchor="start" font-weight="400">Playground</text>
<text x="24" y="120" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Looks</text>
<text x="24" y="156" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Sequences</text>
<text x="24" y="192" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Effects</text>
<text x="24" y="228" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Visualiser</text>
<text x="24" y="264" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Switches</text>
<text x="24" y="300" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Devices</text>
<text x="24" y="336" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Bus monitor</text>
<text x="24" y="372" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400">Settings</text>
<rect x="1120" y="48" width="320" height="632" rx="0" fill="#131315" stroke="#2a2a2f"/>
<text x="1140" y="80" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Inspector</text>
<rect x="180" y="680" width="1260" height="220" rx="0" fill="#09090a" stroke="#2a2a2f"/>
<text x="196" y="702" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Console</text>
<text x="1420" y="702" fill="#9a9aa0" font-size="11" text-anchor="end" font-weight="400">Ctrl-` to hide   help keys</text>
<rect x="180" y="48" width="940" height="36" rx="0" fill="#3a1f1e" stroke="#d9534f"/>
<text x="204" y="71" fill="#e8e8ea" font-size="13" text-anchor="start" font-weight="400">Panic: everything is stopped and off. Nothing is sent until you resume.</text>
<rect x="1010" y="53" width="96" height="26" rx="4" fill="#1b1b1e" stroke="#2a2a2f"/>
<text x="1058" y="71" fill="#e8e8ea" font-size="12" text-anchor="middle" font-weight="400">Resume</text>
<rect x="440" y="240" width="480" height="260" rx="8" fill="#1b1b1e" stroke="#2a2a2f"/>
<text x="464" y="280" fill="#e8e8ea" font-size="16" text-anchor="start" font-weight="600">Raise the brightness ceiling?</text>
<text x="464" y="314" fill="#e8e8ea" font-size="13" text-anchor="start" font-weight="400">From 40% (arc 220) to 60% (arc 235).</text>
<text x="464" y="340" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">MAX LEVEL will be rewritten in both drivers and read back.</text>
<text x="464" y="362" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Lowering it again takes effect at once.</text>
<rect x="464" y="390" width="432" height="34" rx="4" fill="#0b0b0c" stroke="#2a2a2f"/>
<text x="476" y="412" fill="#9a9aa0" font-size="12" text-anchor="start" font-weight="400">Type 60 to confirm</text>
<rect x="700" y="446" width="92" height="32" rx="4" fill="#131315" stroke="#2a2a2f"/>
<text x="746" y="467" fill="#e8e8ea" font-size="12" text-anchor="middle" font-weight="400">Cancel</text>
<rect x="804" y="446" width="92" height="32" rx="4" fill="#131315" stroke="#8fb4d9"/>
<text x="850" y="467" fill="#e8e8ea" font-size="12" text-anchor="middle" font-weight="400">Raise</text>
<text x="196" y="730" fill="#e8e8ea" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, monospace">% panic</text>
<text x="196" y="750" fill="#9a9aa0" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, monospace">  terminate, off all</text>
<text x="196" y="770" fill="#d9534f" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, monospace">  latched. Type resume to continue.</text>
<text x="196" y="790" fill="#e8e8ea" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, monospace">% _</text>
</svg>
