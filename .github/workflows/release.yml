name: Release

# A tag v* builds the archive, attests it and publishes a release. A manual run builds the archive
# only, to try the build with nothing published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm through corepack
        run: |
          npm install --global --ignore-scripts corepack@0.36.0
          corepack enable
          pnpm --version
      - name: The tag matches the version in package.json
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$REF_NAME" = "v$version" || { echo "Tag $REF_NAME is not v$version." >&2; exit 1; }
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: SBOMs
        run: pnpm sbom:all
      - name: Pack
        run: tools/release/pack.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    # Only a pushed tag publishes: a manual run builds and stops, whatever ref it is run on.
    # Attestations on this account's plan need a public repo, so a tag pushed while the repo is
    # private stops here with nothing published. That the tagged commit is on main and passed CI
    # is for the tag ruleset to hold, not this workflow.
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the sums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Publish the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A draft first, with every file attached, then published: if release immutability is
          # on, the files are all in place before the release locks.
          gh release create "$REF_NAME" --draft --verify-tag --title "Enlighten $REF_NAME" \
            --notes "See CHANGELOG.md for what is in this release, and the README for how to verify it: the SHA-256 sums are in SHA256SUMS, and each file has a build provenance attestation." \
            ./*.tar.gz ./*.cdx.json SHA256SUMS
          gh release edit "$REF_NAME" --draft=false
